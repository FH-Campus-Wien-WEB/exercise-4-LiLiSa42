<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies!</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="index.js"></script>
  </head>

  <body>
    <header>
      <div>
        <h1>LiLis favourite Movies</h1>
        <p id="userGreeting">Bitte melde dich an, um deine Sammlung zu sehen.</p>
      </div>
      <div class="controls">
        <button id="loginButton" type="button">Login</button>
        <button id="logoutButton" type="button" hidden>Logout</button>
        <button id="openSearchButton" type="button" hidden>Search &amp; Add</button>
      </div>
    </header>

    <nav>
      <ul></ul>
    </nav>

    <main></main>

    <dialog id="loginDialog">
      <form id="loginForm">
        <h2>Login</h2>
        <label for="username">Username</label>
        <input id="username" name="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <div class="dialog-actions">
          <button type="submit">Login</button>
          <button type="button" id="cancelLogin">Cancel</button>
        </div>
        <p class="error" id="loginError"></p>
      </form>
    </dialog>

    <dialog id="searchDialog">
      <form id="searchForm">
        <h2>Search Movies</h2>
        <label for="query">Title</label>
        <input id="query" name="query" type="search" required autocomplete="off" />

        <div class="dialog-actions">
          <button type="submit">Search</button>
          <button type="button" id="cancelSearch">Cancel</button>
        </div>

        <div id="searchResults"></div>
      </form>
    </dialog>

    <footer>
      <p>&copy; All rights reserved.</p>
    </footer>
  </body>
</html>
